symbols: ["SPY", "QQQ"]

swing:
  target_dte: [7, 10]
  short_strike_delta: [0.15, 0.30]
  spread_width:
    SPY: 5
    QQQ: 3
  min_premium: 0.50
  iv_rank_threshold: 30
  profit_target_pct: 50

exhaustion:
  enabled: true
  target_dte: [1, 2]
  spread_width:
    SPY: 5
    QQQ: 3
  min_premium: 0.25
  profit_target_pct: 20
  stop_loss_multiplier: 1.5
  time_window_start: "11:00"
  rsi_overbought: 70
  rsi_oversold: 30
  intraday_timeframe: "5min"
  min_signals_required: 3
  min_move_from_open_pct: 0.8
  strong_move_pct: 1.5
  close_by_eod: true

risk:
  max_concurrent_spreads: 10
  max_risk_per_trade_pct: 5
  max_buying_power_usage_pct: 60
  stop_loss_multiplier: 2.0
  roll_delta_threshold: 0.50
  dte_exit: 1
  daily_loss_limit: 1000
  daily_income_target: 500
  max_same_direction_per_symbol: 3
  max_portfolio_delta_per_symbol: 0.30
  # Enhanced risk settings
  max_correlated_same_direction: 4   # max same-direction across correlated assets (SPY+QQQ)
  max_portfolio_vega: 500            # max vega exposure ($ impact per 1pt IV move)
  max_contracts_per_trade: 10        # cap on dynamic position sizing
  drawdown:
    loss_streak_reduce: 3            # reduce size after N consecutive losses
    loss_streak_halt: 5              # stop trading after N consecutive losses
    cooldown_minutes: 60             # cooldown duration after streak halt
    drawdown_reduce_pct: 5.0         # start reducing size at this drawdown %
    drawdown_severe_pct: 10.0        # severe size reduction at this drawdown %
    drawdown_halt_pct: 15.0          # halt trading at this drawdown %

regime:
  enabled: true
  vix_symbol: "VIXY"                 # VIX proxy ETF (Alpaca doesn't have VIX directly)
  vix_low: 14.0                      # below = complacency, low premiums
  vix_elevated: 20.0                 # above = fear rising, good for premium selling
  vix_crisis: 30.0                   # above = panic, widen strikes or sit out
  adx_weak: 20.0                     # below = range-bound (ideal for selling premium)
  adx_strong: 25.0                   # above = trending (be careful selling premium)
  halt_on_crisis_backwardation: true  # stop trading in VIX crisis + backwardation
  halt_on_crisis_trending: true       # stop trading in VIX crisis + trending market

execution:
  price_adjustment_interval: 30
  price_adjustment_step: 0.01
  fill_timeout: 300

schedule:
  scan_interval_minutes: 5
  market_hours_only: true

notifications:
  sms_enabled: true
  email_enabled: true
  sms_events: ["fill", "stop_loss", "roll", "circuit_breaker", "error", "regime_change", "drawdown_alert"]
  email_events: ["daily_summary", "weekly_recap"]
