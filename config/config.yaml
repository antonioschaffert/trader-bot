symbols: ["SPY", "QQQ"]

swing:
  target_dte: [7, 10]
  short_strike_delta: [0.15, 0.30]
  spread_width:
    SPY: 5
    QQQ: 3
  min_premium: 0.50
  iv_rank_threshold: 30
  iv_percentile_threshold: 20        # require current IV to be above 20th percentile of 52w distribution
  profit_target_pct: 50
  # Liquidity / execution guardrails (prevent selling into wide or illiquid markets)
  min_open_interest: 250              # reject contracts with OI below this
  max_bid_ask_spread_pct: 0.25        # reject contracts where spread > 25% of mid
  slippage_buffer_pct: 0.10           # assume 10% haircut from mid when building net credit
  sr_buffer_pct_min: 0.025            # minimum 2.5% buffer from support/resistance
  allow_delta_fallback: false         # don't guess strikes when Greeks are missing

exhaustion:
  enabled: true
  target_dte: [1, 2]
  spread_width:
    SPY: 5
    QQQ: 3
  min_premium: 0.25
  profit_target_pct: 20
  stop_loss_multiplier: 1.5
  time_window_start: "11:00"
  rsi_overbought: 70
  rsi_oversold: 30
  intraday_timeframe: "5min"
  min_signals_required: 4              # was 3 - raised after adding climax signal to avoid bogus fades
  min_move_from_open_pct: 0.8
  strong_move_pct: 1.5
  close_by_eod: true
  min_open_interest: 150
  max_bid_ask_spread_pct: 0.30
  slippage_buffer_pct: 0.10

risk:
  max_concurrent_spreads: 10
  max_risk_per_trade_pct: 5
  max_buying_power_usage_pct: 60
  stop_loss_multiplier: 2.0
  roll_delta_threshold: 0.50
  dte_exit: 1
  daily_loss_limit: 1000
  daily_income_target: 500
  max_same_direction_per_symbol: 3
  max_portfolio_delta_per_symbol: 0.30
  # Slippage buffer applied to target_premium when validating risk & sizing.
  slippage_buffer_pct: 0.10
  # Trailing stop (protects realized gains once position has been profitable).
  trailing_stop_activation_pct: 40     # arm after position reaches 40% of max profit
  trailing_stop_giveback_pct: 50       # exit if we give back >= 50% of peak profit
  # Enhanced risk settings
  max_correlated_same_direction: 4   # max same-direction across correlated assets (SPY+QQQ)
  max_portfolio_vega: 500            # max vega exposure ($ impact per 1pt IV move)
  max_contracts_per_trade: 10        # cap on dynamic position sizing
  drawdown:
    loss_streak_reduce: 3            # reduce size after N consecutive losses
    loss_streak_halt: 5              # stop trading after N consecutive losses
    cooldown_minutes: 60             # cooldown duration after streak halt
    drawdown_reduce_pct: 5.0         # start reducing size at this drawdown %
    drawdown_severe_pct: 10.0        # severe size reduction at this drawdown %
    drawdown_halt_pct: 15.0          # halt trading at this drawdown %

wheel:
  enabled: true
  symbols: ["SPY", "QQQ"]             # wheel-specific symbols (must afford 100 shares)
  target_dte: [14, 35]                # 14-35 days to expiration
  csp_delta_range: [0.18, 0.42]       # absolute delta for cash-secured puts
  cc_delta_range: [0.18, 0.42]        # absolute delta for covered calls
  min_open_interest: 200              # minimum open interest filter
  csp_strike_range_pct: 5             # CSP strike within 5% of current price
  cc_above_bollinger: true            # require CC strike above upper Bollinger Band
  max_buying_power_pct: 10            # max % of account per wheel position
  roll_delta_multiplier: 2.0          # roll when delta >= entry_delta * this
  roll_profit_pct: 50                 # close at 50% of max profit
  profit_target_pct: 50               # take profit at 50% premium decay
  max_positions: 2                    # max concurrent wheel positions

regime:
  enabled: true
  vix_symbol: "VIXY"                 # VIX proxy ETF (Alpaca doesn't have VIX directly)
  vix_low: 14.0                      # below = complacency, low premiums
  vix_elevated: 20.0                 # above = fear rising, good for premium selling
  vix_crisis: 30.0                   # above = panic, widen strikes or sit out
  adx_weak: 20.0                     # below = range-bound (ideal for selling premium)
  adx_strong: 25.0                   # above = trending (be careful selling premium)
  halt_on_crisis_backwardation: true  # stop trading in VIX crisis + backwardation
  halt_on_crisis_trending: true       # stop trading in VIX crisis + trending market

execution:
  price_adjustment_interval: 30
  price_adjustment_step: 0.01
  fill_timeout: 300

schedule:
  scan_interval_minutes: 5
  market_hours_only: true

notifications:
  sms_enabled: true
  email_enabled: true
  sms_events: ["fill", "stop_loss", "roll", "circuit_breaker", "error", "regime_change", "drawdown_alert"]
  email_events: ["daily_summary", "weekly_recap"]
